name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if token available)
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'msaid356' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata & tags
        id: meta
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER_LOWER" >> $GITHUB_OUTPUT
          
          # Base GHCR tags (always built and pushed to GitHub Packages)
          TAGS="ghcr.io/${OWNER_LOWER}/zyro-electric:latest,ghcr.io/${OWNER_LOWER}/zyro-electric:${{ github.sha }}"
          
          # Append Docker Hub tags if Docker Hub login token exists
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            TAGS="${TAGS},msaid356/zyro-electric:latest,msaid356/zyro-electric:${{ github.sha }}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Verify build
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "GitHub Package: ghcr.io/${{ steps.meta.outputs.owner }}/zyro-electric:latest"
