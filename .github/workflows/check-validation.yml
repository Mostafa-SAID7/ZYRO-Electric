name: Check Configuration Validation

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate package.json
        run: |
          cat package.json > /dev/null 2>&1 && echo "package.json valid" || exit 1

      - name: Validate tsconfig.json
        run: |
          cat tsconfig.json > /dev/null 2>&1 && echo "tsconfig.json valid" || exit 1

      - name: Validate angular.json
        run: |
          cat angular.json > /dev/null 2>&1 && echo "angular.json valid" || exit 1

  validate-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Check package-lock exists
        run: |
          if [ ! -f "package-lock.json" ]; then
            exit 1
          fi
          echo "Dependencies validation passed"

  validate-dockerfile:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: |
          if [ ! -f "Dockerfile" ]; then
            exit 1
          fi
          echo "Dockerfile validated"

  validate-environment:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment files
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            exit 1
          fi
          echo "Environment files validated"
