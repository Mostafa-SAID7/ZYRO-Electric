name: Publish Docker Image to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
        continue-on-error: true

      - name: Note about GHCR Push
        run: |
          echo "GitHub Container Registry Configuration"
          echo "========================================="
          echo ""
          echo "Current status:"
          echo "  • Docker image built and pushed to GHCR (if authenticated)"
          echo "  • GITHUB_TOKEN has limited permissions for GHCR"
          echo ""
          echo "To enable full GHCR publishing:"
          echo "  1. Create Personal Access Token (PAT)"
          echo "     - Go to: https://github.com/settings/tokens"
          echo "     - Scopes: write:packages, read:packages"
          echo ""
          echo "  2. Add as repository secret"
          echo "     - Settings > Secrets > New repository secret"
          echo "     - Name: GH_PAT"
          echo ""
          echo "  3. Update workflow to use GH_PAT instead of GITHUB_TOKEN"
          echo ""
          echo "Primary publishing target: Docker Hub (msaid356/zyro-electric)"
