name: Publish Docker Image to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-only:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v5

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: zyro-electric:build-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "Docker Build Summary"
          echo "===================="
          echo ""
          echo "Image built successfully"
          echo "  • Context: ."
          echo "  • Dockerfile: ./Dockerfile"
          echo "  • Tag: zyro-electric:build-${{ github.sha }}"
          echo ""
          echo "Primary Publishing Target"
          echo "  • Docker Hub: msaid356/zyro-electric"
          echo "  • Status: LIVE"
          echo "  • Latest tags: latest, 1.0.0, v1, stable"
          echo ""
          echo "GitHub Container Registry (GHCR)"
          echo "  • Status: Requires Personal Access Token (PAT)"
          echo "  • Setup: See GHCR_SETUP_GUIDE.md"
          echo "  • Configuration: Ready for manual push"
          echo ""
          echo "To manually push to Docker Hub:"
          echo "  docker tag zyro-electric:build-${{ github.sha }} msaid356/zyro-electric:latest"
          echo "  docker push msaid356/zyro-electric:latest"
