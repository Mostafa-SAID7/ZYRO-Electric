name: Check Lighthouse Performance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-save

      - name: Build application
        run: npm run build

      - name: Wait for build
        run: sleep 5

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-vitals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-save

      - name: Build application
        run: npm run build

      - name: Analyze web vitals
        run: |
          echo "Web Vitals Analysis"
          echo "==================="
          echo ""
          echo "Performance Metrics:"
          echo "  • FCP (First Contentful Paint) - target < 1.8s"
          echo "  • LCP (Largest Contentful Paint) - target < 2.5s"
          echo "  • FID (First Input Delay) - target < 100ms"
          echo "  • CLS (Cumulative Layout Shift) - target < 0.1"
          echo "  • TTFB (Time to First Byte) - target < 600ms"
          echo ""
          echo "Accessibility:"
          echo "  • WCAG 2.1 Level AA"
          echo "  • Semantic HTML"
          echo "  • ARIA labels"
          echo ""
          echo "SEO:"
          echo "  • Meta tags"
          echo "  • Structured data"
          echo "  • Mobile friendly"
          echo ""
          echo "Best Practices:"
          echo "  • HTTPS"
          echo "  • No console errors"
          echo "  • No deprecated APIs"

  page-load-time:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-save

      - name: Build application
        run: npm run build

      - name: Check build output
        run: |
          echo "Page Load Performance"
          echo "====================="
          echo ""
          if [ -d "dist/market" ]; then
            echo "Build artifacts created successfully"
            du -sh dist/market/
            echo ""
            echo "Expected load times (3G):"
            echo "  • Initial load: < 3s"
            echo "  • Interactive: < 5s"
            echo ""
            echo "Expected load times (4G):"
            echo "  • Initial load: < 1.5s"
            echo "  • Interactive: < 2.5s"
          fi
