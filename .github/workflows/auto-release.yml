name: Auto Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Get tag info
        id: tag_info
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 $TAG^ 2>/dev/null || echo "")
          
          echo "Current tag: $TAG"
          echo "Previous tag: $PREV_TAG"
          
          if [ -z "$PREV_TAG" ]; then
            # First release - show all commits
            COMMITS=$(git log --oneline $TAG --pretty=format:"* %h - %s (%an)")
          else
            # Show commits since last tag
            COMMITS=$(git log --oneline $PREV_TAG..$TAG --pretty=format:"* %h - %s (%an)")
          fi
          
          # Create changelog
          CHANGELOG="## What's Changed

### Commits
$COMMITS

### Release Info
- **Version**: ${{ steps.tag_info.outputs.version }}
- **Tag**: $TAG
- **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
- **Commit**: $(git rev-parse --short HEAD)

### Features & Fixes
See commits above for detailed changes.

### Installation
\`\`\`bash
npm install @mostafa-said7/zyro-electric@${{ steps.tag_info.outputs.version }}
\`\`\`

### Docker
\`\`\`bash
docker pull ghcr.io/mostafa-said7/zyro-electric:${{ steps.tag_info.outputs.version }}
\`\`\`

---
**Auto-generated release** | [View on GitHub](https://github.com/Mostafa-SAID7/ZYRO-Electric/releases/tag/$TAG)"
          
          # Save to file for output
          echo "$CHANGELOG" > /tmp/changelog.md
          
          # Output for GitHub
          {
            echo "changelog<<EOF"
            cat /tmp/changelog.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            package.json
            README.md
            Dockerfile
            docker-compose.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notification
        run: |
          echo "✅ GitHub Release Created"
          echo "Tag: ${{ steps.tag_info.outputs.tag }}"
          echo "Version: ${{ steps.tag_info.outputs.version }}"
          echo "URL: https://github.com/Mostafa-SAID7/ZYRO-Electric/releases/tag/${{ steps.tag_info.outputs.tag }}"
