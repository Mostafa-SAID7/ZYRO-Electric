name: Manage Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release from'
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG=$(git tag -l | grep '^v' | sort -V | tail -2 | head -1)
          
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline "$TAG" | head -20)
          else
            CHANGELOG=$(git log --oneline "$PREV_TAG".."$TAG")
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            # Release ${{ steps.tag.outputs.tag }}
            
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ## Deployment
            - **Production:** Deployed to Vercel
            - **CDN:** Global edge network active
            - **Status:** Live
            
            ## Package Info
            - **npm:** @mostafa-said7/zyro-electric@${{ steps.tag.outputs.tag }}
            - **Docker:** ghcr.io/mostafa-said7/zyro-electric:${{ steps.tag.outputs.tag }}
            
            ---
            Released by GitHub Actions
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-npm:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}

  publish-to-docker:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract version
        id: version
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner | lower }}/zyro-electric:latest
            ghcr.io/${{ github.repository_owner | lower }}/zyro-electric:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: [publish-to-npm, publish-to-docker]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Vercel deployment
        run: |
          echo "Production deployment triggered"
          echo "Release is now live on Vercel"
          echo "URL: https://zyro-electric.vercel.app"

  release-notification:
    needs: [create-release, publish-to-npm, publish-to-docker, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Release completed
        run: |
          echo "Release pipeline completed"
          echo ""
          echo "Summary:"
          echo "  ✓ GitHub Release created"
          echo "  ✓ NPM package published"
          echo "  ✓ Docker image pushed"
          echo "  ✓ Production deployed"
          echo ""
          echo "View release: ${{ github.server_url }}/${{ github.repository }}/releases"
