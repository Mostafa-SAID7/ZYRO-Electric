name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - develop
      - testing
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Deploy to Vercel (Production)
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_qtHEfgqPZSTu1viXoTU6aHrE
          VERCEL_PROJECT_ID: prj_g4ws7Ahaic1ltl4V9BWgvUQtigpV
        run: |
          rm -rf .vercel
          npm install -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN" --yes

      - name: Deployment status
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Build completed"
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "✅ Vercel secrets configured - deployment executed"
          else
            echo "⚠️ Vercel secrets not configured - deployment skipped"
            echo "To enable: Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to GitHub secrets"
          fi
