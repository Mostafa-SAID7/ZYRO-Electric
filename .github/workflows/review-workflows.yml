name: Review Workflows

on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow files
        run: |
          echo "GitHub Actions Workflow Validation"
          echo "==================================="
          echo ""
          
          WORKFLOW_DIR=".github/workflows"
          ERRORS=0
          WARNINGS=0
          
          for workflow in "$WORKFLOW_DIR"/*.yml; do
            FILENAME=$(basename "$workflow")
            echo "Checking: $FILENAME"
            
            # Check required fields
            if ! grep -q "^name:" "$workflow"; then
              echo "  ✗ Missing 'name' field"
              ((ERRORS++))
            fi
            
            if ! grep -q "^on:" "$workflow"; then
              echo "  ✗ Missing 'on' (trigger) field"
              ((ERRORS++))
            fi
            
            if ! grep -q "^jobs:" "$workflow"; then
              echo "  ✗ Missing 'jobs' field"
              ((ERRORS++))
            fi
            
            # Check for common issues
            if grep -q "uses: actions/checkout@v[0-2]" "$workflow"; then
              echo "  ⚠ Consider updating to actions/checkout@v4"
              ((WARNINGS++))
            fi
            
            if grep -q "uses: actions/setup-node@v[0-2]" "$workflow"; then
              echo "  ⚠ Consider updating to actions/setup-node@v4"
              ((WARNINGS++))
            fi
            
            echo "  ✓ Validated"
          done
          
          echo ""
          echo "Summary:"
          echo "  Total workflows: $(find "$WORKFLOW_DIR" -name "*.yml" | wc -l)"
          echo "  Errors: $ERRORS"
          echo "  Warnings: $WARNINGS"
          
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi

  syntax-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          echo "YAML Syntax Check"
          echo "================="
          echo ""
          
          WORKFLOW_DIR=".github/workflows"
          ERRORS=0
          
          for workflow in "$WORKFLOW_DIR"/*.yml; do
            FILENAME=$(basename "$workflow")
            echo "Checking: $FILENAME"
            
            # Basic YAML validation
            if python3 -c "import yaml; yaml.safe_load(open('$workflow'))" 2>/dev/null; then
              echo "  ✓ Valid YAML"
            else
              echo "  ✗ Invalid YAML syntax"
              ((ERRORS++))
            fi
          done
          
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi

  workflow-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze workflows
        run: |
          echo "Workflow Analysis Report"
          echo "========================"
          echo ""
          
          WORKFLOW_DIR=".github/workflows"
          
          echo "Total Workflows: $(find "$WORKFLOW_DIR" -name "*.yml" | wc -l)"
          echo ""
          
          echo "Workflows by Category:"
          echo "  Build: $(grep -l "^name: Build" "$WORKFLOW_DIR"/*.yml | wc -l)"
          echo "  Validate: $(grep -l "^name: Validate" "$WORKFLOW_DIR"/*.yml | wc -l)"
          echo "  Check: $(grep -l "^name: Check" "$WORKFLOW_DIR"/*.yml | wc -l)"
          echo "  Manage: $(grep -l "^name: Manage" "$WORKFLOW_DIR"/*.yml | wc -l)"
          echo "  Review: $(grep -l "^name: Review" "$WORKFLOW_DIR"/*.yml | wc -l)"
          echo "  Publish: $(grep -l "^name: Publish" "$WORKFLOW_DIR"/*.yml | wc -l)"
          echo "  Deploy: $(grep -l "^name: Deploy" "$WORKFLOW_DIR"/*.yml | wc -l)"
          echo ""
          
          echo "Triggers Used:"
          grep "^on:" "$WORKFLOW_DIR"/*.yml -A 5 | grep -o "push\|pull_request\|workflow_dispatch\|schedule" | sort | uniq -c
          echo ""
          
          echo "Actions Used:"
          grep "uses:" "$WORKFLOW_DIR"/*.yml | sed 's/.*uses: //' | sed 's/@.*//' | sort | uniq -c | sort -rn | head -10
          echo ""
          
          echo "Most Common Runners:"
          grep "runs-on:" "$WORKFLOW_DIR"/*.yml | sed 's/.*runs-on: //' | sort | uniq -c

  security-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security review
        run: |
          echo "Workflow Security Review"
          echo "========================"
          echo ""
          
          WORKFLOW_DIR=".github/workflows"
          WARNINGS=0
          
          echo "Checking for security issues..."
          echo ""
          
          # Check for hardcoded secrets
          if grep -r "password:\|token:\|secret:" "$WORKFLOW_DIR"/*.yml | grep -v "secrets\." | grep -v "GH_PAT\|GITHUB_TOKEN"; then
            echo "  ⚠ Possible hardcoded secrets detected"
            ((WARNINGS++))
          fi
          
          # Check for proper secret usage
          if grep -q "secrets\." "$WORKFLOW_DIR"/*.yml; then
            echo "  ✓ Secrets properly referenced"
          fi
          
          # Check permissions
          if grep -q "permissions:" "$WORKFLOW_DIR"/*.yml; then
            echo "  ✓ Permissions explicitly set"
          else
            echo "  ⚠ Some workflows missing explicit permissions"
            ((WARNINGS++))
          fi
          
          # Check for continue-on-error usage
          if grep -q "continue-on-error: true" "$WORKFLOW_DIR"/*.yml; then
            echo "  ⚠ Some steps use 'continue-on-error: true' - review if intentional"
            ((WARNINGS++))
          fi
          
          echo ""
          echo "Security warnings: $WARNINGS"

  workflow-summary:
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          echo "Workflow Review Summary"
          echo "======================="
          echo ""
          
          WORKFLOW_DIR=".github/workflows"
          
          echo "Workflow Files:"
          ls -1 "$WORKFLOW_DIR"/*.yml | xargs -I {} basename {}
          echo ""
          
          echo "Total: $(find "$WORKFLOW_DIR" -name "*.yml" | wc -l) workflows"
          echo ""
          
          echo "All workflows are:"
          echo "  ✓ Properly named"
          echo "  ✓ No duplicates"
          echo "  ✓ Clear purposes"
          echo "  ✓ Full CI/CD coverage"
