<section
  #container
  class="relative w-full h-[600vh] bg-[#050505] text-white font-sans selection:bg-white selection:text-black"
>
  <div class="sticky top-0 h-screen w-full flex justify-center items-center overflow-hidden">
    <div
      [style.width]="bannerWidth"
      [style.height]="bannerHeight"
      [style.borderRadius]="bannerRadius"
      [style.borderWidth]="bannerBorderWidth"
      [style.borderColor]="'#2c2738'"
      class="relative bg-black overflow-hidden flex items-center justify-center max-w-full w-full will-change-transform backface-hidden preserve-3d transition-all duration-300"
    >
        <div
          class="absolute inset-0 flex justify-center items-center pointer-events-none"
          [style.perspective]="'1000px'"
        >
          <!-- Ambient Shadow Box Masking -->
          <div
            class="absolute inset-0 z-20 shadow-[inset_0_100px_150px_-50px_rgba(0,0,0,1),inset_0_-100px_150px_-50px_rgba(0,0,0,1)]"
          ></div>
          <div
            class="absolute inset-0 z-20 shadow-[inset_150px_0_150px_-50px_rgba(0,0,0,1),inset_-150px_0_150px_-50px_rgba(0,0,0,1)]"
          ></div>

          <!-- Parallax Image Grid Matrix -->
          <div
            [style.transform]="get3DTransformStyle()"
            [style.transformStyle]="'preserve-3d'"
            class="flex gap-4 md:gap-6 justify-center items-center w-[120vw] h-[150vh] origin-center opacity-100 will-change-transform backface-hidden transition-transform duration-100"
          >
            <!-- Column 1 -->
            <div
              [style.transform]="getTransformStyle(1)"
              class="flex flex-col gap-4 md:gap-6 w-[22vw] min-w-[200px] pointer-events-auto transition-transform duration-100"
            >
              @for (src of colMedia.col1; track $index) {
              <div
                class="w-full h-[200px] sm:h-[300px] md:h-[400px] flex-shrink-0 bg-[#111] transition-transform duration-300 hover:scale-[1.02] cursor-pointer relative will-change-transform backface-hidden preserve-3d"
              >
                <img
                  [src]="src"
                  [alt]="'Gallery Asset ' + $index"
                  loading="lazy"
                  (load)="onImageLoad()"
                  class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity duration-300"
                />
              </div>
              }
            </div>

            <!-- Column 2 -->
            <div
              [style.transform]="getTransformStyle(2)"
              class="flex flex-col gap-4 md:gap-6 w-[22vw] min-w-[200px] pointer-events-auto transition-transform duration-100"
            >
              @for (src of colMedia.col2; track $index) {
              <div
                class="w-full h-[200px] sm:h-[300px] md:h-[400px] flex-shrink-0 bg-[#111] transition-transform duration-300 hover:scale-[1.02] cursor-pointer relative will-change-transform backface-hidden preserve-3d"
              >
                <img
                  [src]="src"
                  [alt]="'Gallery Asset ' + $index"
                  loading="lazy"
                  (load)="onImageLoad()"
                  class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity duration-300"
                />
              </div>
              }
            </div>

            <!-- Column 3 -->
            <div
              [style.transform]="getTransformStyle(3)"
              class="flex flex-col gap-4 md:gap-6 w-[22vw] min-w-[200px] pointer-events-auto transition-transform duration-100"
            >
              @for (src of colMedia.col3; track $index) {
              <div
                class="w-full h-[200px] sm:h-[300px] md:h-[400px] flex-shrink-0 bg-[#111] transition-transform duration-300 hover:scale-[1.02] cursor-pointer relative will-change-transform backface-hidden preserve-3d"
              >
                <img
                  [src]="src"
                  [alt]="'Gallery Asset ' + $index"
                  loading="lazy"
                  (load)="onImageLoad()"
                  class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity duration-300"
                />
              </div>
              }
            </div>

            <!-- Column 4 -->
            <div
              [style.transform]="getTransformStyle(4)"
              class="flex flex-col gap-4 md:gap-6 w-[22vw] min-w-[200px] pointer-events-auto transition-transform duration-100"
            >
              @for (src of colMedia.col4; track $index) {
              <div
                class="w-full h-[200px] sm:h-[300px] md:h-[400px] flex-shrink-0 bg-[#111] transition-transform duration-300 hover:scale-[1.02] cursor-pointer relative will-change-transform backface-hidden preserve-3d"
              >
                <img
                  [src]="src"
                  [alt]="'Gallery Asset ' + $index"
                  loading="lazy"
                  (load)="onImageLoad()"
                  class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity duration-300"
                />
              </div>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
