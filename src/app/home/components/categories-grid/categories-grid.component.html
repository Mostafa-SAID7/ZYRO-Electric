<section class="max-w-7xl mx-auto px-4 md:px-6 py-20">
  <div class="space-y-10">
    <div class="text-center max-w-2xl mx-auto">
      <h2 class="text-4xl md:text-5xl font-black mb-4">Shop by Category</h2>
      <p class="text-lg text-muted-foreground font-medium">Browse all 9 curated tech accessory niches</p>
    </div>

    <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-4">
      @for (category of categories; track category) {
        <div
          tabindex="0"
          (click)="goToCategory(category)"
          (keyup.enter)="goToCategory(category)"
          class="group cursor-pointer h-full">
          <div [ngClass]="'bg-gradient-to-br ' + category.color"
            class="p-5 rounded-[1.5rem] text-white text-center space-y-3 shadow-md group-hover:shadow-xl transition-all duration-300 transform group-hover:-translate-y-2 border border-white/10 relative overflow-hidden h-full flex flex-col items-center justify-center">
            <div class="absolute inset-0 bg-white/0 group-hover:bg-white/10 transition-colors duration-300"></div>
            <div class="text-3xl relative z-10">{{ category.icon }}</div>
            <p class="font-bold text-xs relative z-10 leading-tight">{{ category.name }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
