<header class="sticky top-0 z-40 bg-card border-b border-border shadow-md">
  <nav class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between px-4 md:px-6 py-3 md:py-4 gap-4">
      
      <!-- Left: Brand Logo & Name -->
      <div class="flex items-center flex-shrink-0">
        <h1 class="text-lg md:text-2xl font-bold gradient-text cursor-pointer flex items-center gap-2"
          (click)="goToHome()"
          title="Go to Home">
          <svg class="w-6 md:w-8 h-6 md:h-8" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7 4V3m10 0v1m3.15 2.75h2.08a2 2 0 012 2v12a2 2 0 01-2 2H1.92a2 2 0 01-2-2V8.75a2 2 0 012-2h2.08m0 0A2 2 0 017 5h10a2 2 0 012 2m0 0V7a2 2 0 11-4 0V5m-4 0a2 2 0 11-4 0v2m0-2V5a2 2 0 10-4 0v2"></path>
          </svg>
          <span class="hidden sm:inline">Market</span>
        </h1>
      </div>

      <!-- Center: Main Navigation -->
      <div class="flex-1 flex justify-center">
        <ul class="flex gap-6 md:gap-12 list-none m-0 p-0">
          <li class="nav-link-hover">
            <a 
              routerLink="/"
              routerLinkActive="text-accent"
              [routerLinkActiveOptions]="{ exact: true }"
              class="text-foreground font-semibold text-sm md:text-base hover:text-accent transition-colors flex items-center gap-2">
              <svg class="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 13h2v8H3zm4-8h2v16H7zm4-2h2v18h-2zm4 4h2v14h-2zm4-4h2v18h-2z"></path>
              </svg>
              <span class="hidden xs:inline">Home</span>
            </a>
          </li>
          <li class="nav-link-hover">
            <a 
              routerLink="/products"
              routerLinkActive="text-accent"
              [routerLinkActiveOptions]="{ exact: true }"
              class="text-foreground font-semibold text-sm md:text-base hover:text-accent transition-colors flex items-center gap-2">
              <svg class="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
              </svg>
              <span class="hidden xs:inline">Shop</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Right: Cart Icon & User Icon -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- Cart Icon -->
        <button 
          (click)="toggleCartDrawer()"
          class="relative p-2 hover:bg-secondary rounded-lg transition-colors duration-200 group"
          title="Open shopping cart">
          <svg class="w-6 h-6 text-foreground group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m10-9l2 9m-9-9h14M9 18h12"></path>
          </svg>
          <span *ngIf="cartItemCount > 0" 
            class="absolute top-0 right-0 inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-accent-foreground bg-accent rounded-full">
            {{ cartItemCount }}
          </span>
        </button>

        <!-- User Icon -->
        <button 
          (click)="isLoggedIn ? logout() : goToAuth()"
          class="p-2 hover:bg-secondary rounded-lg transition-colors duration-200 group"
          [title]="isLoggedIn ? 'Logout' : 'Login'">
          <svg *ngIf="!isLoggedIn" class="w-6 h-6 text-foreground group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <svg *ngIf="isLoggedIn" class="w-6 h-6 text-foreground group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
        </button>
      </div>
    </div>
  </nav>
</header>

<!-- Cart Drawer using UI Drawer Component -->
<app-ui-drawer 
  [isOpen]="isCartDrawerOpen"
  (closed)="closeCartDrawer()"
  title="Shopping Cart"
  [badge]="cartItemCount > 0 ? cartItemCount.toString() : undefined"
  position="right">
  
  <!-- Drawer Icon -->
  <svg drawer-icon class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
    <path d="M7 4V3m10 0v1m3.15 2.75h2.08a2 2 0 012 2v12a2 2 0 01-2 2H1.92a2 2 0 01-2-2V8.75a2 2 0 012-2h2.08m0 0A2 2 0 017 5h10a2 2 0 012 2m0 0V7a2 2 0 11-4 0V5m-4 0a2 2 0 11-4 0v2m0-2V5a2 2 0 10-4 0v2"></path>
  </svg>

  <!-- Drawer Content -->
  <div drawer-content>
    <!-- Empty State -->
    <div *ngIf="cartItems.length === 0" class="flex flex-col items-center justify-center min-h-full text-center py-12">
      <svg class="w-16 h-16 text-accent mb-4 opacity-20" fill="currentColor" viewBox="0 0 24 24">
        <path d="M7 4V3m10 0v1m3.15 2.75h2.08a2 2 0 012 2v12a2 2 0 01-2 2H1.92a2 2 0 01-2-2V8.75a2 2 0 012-2h2.08m0 0A2 2 0 017 5h10a2 2 0 012 2m0 0V7a2 2 0 11-4 0V5m-4 0a2 2 0 11-4 0v2m0-2V5a2 2 0 10-4 0v2"></path>
      </svg>
      <p class="text-muted-foreground font-semibold mb-2 text-lg">Your cart is empty</p>
      <p class="text-sm text-muted-foreground mb-6">Start shopping to add items</p>
      <button 
        (click)="goToProducts()"
        class="btn-primary px-6 py-2">
        Continue Shopping
      </button>
    </div>

    <!-- Cart Items List -->
    <div *ngIf="cartItems.length > 0" class="space-y-4">
      <div *ngFor="let item of cartItems" class="flex gap-3 pb-4 border-b border-border last:border-0">
        <!-- Product Image -->
        <div class="w-20 h-20 rounded-lg bg-muted flex-shrink-0 flex items-center justify-center overflow-hidden">
          <img *ngIf="item.product?.image" [src]="item.product.image" [alt]="item.product?.title" class="w-full h-full object-cover">
          <svg *ngIf="!item.product?.image" class="w-8 h-8 text-muted-foreground" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"></path>
          </svg>
        </div>

        <!-- Product Info -->
        <div class="flex-1 min-w-0">
          <h3 class="font-semibold text-sm truncate">{{ item.product?.title || 'Product' }}</h3>
          <p class="text-xs text-muted-foreground">{{ item.product?.price | currency }}</p>
          
          <!-- Quantity Controls -->
          <div class="flex items-center gap-2 mt-2">
            <button 
              (click)="updateQuantity(item.productId, item.quantity - 1)"
              class="p-1 hover:bg-secondary rounded text-xs">
              <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
                <path d="M19 13H5v-2h14v2z"></path>
              </svg>
            </button>
            <span class="text-xs font-semibold w-6 text-center">{{ item.quantity }}</span>
            <button 
              (click)="updateQuantity(item.productId, item.quantity + 1)"
              class="p-1 hover:bg-secondary rounded text-xs">
              <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remove Button -->
        <button 
          (click)="removeFromCart(item.productId)"
          class="p-1 hover:bg-red-100 rounded-lg transition-colors text-red-500 hover:text-red-600 flex-shrink-0"
          title="Remove item">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"></path>
          </svg>
        </button>
      </div>

      <!-- Cart Summary -->
      <div class="pt-4 border-t border-border space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-muted-foreground">Subtotal</span>
          <span class="font-semibold">{{ cartTotal | currency }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Drawer Footer -->
  <div drawer-footer class="space-y-3">
    <button 
      *ngIf="cartItems.length > 0"
      (click)="goToCart()"
      class="w-full btn-primary justify-center py-3 font-semibold">
      View Full Cart
    </button>
    <button 
      *ngIf="cartItems.length > 0"
      (click)="goToProducts()"
      class="w-full btn-outline justify-center py-2">
      Continue Shopping
    </button>
    <button 
      *ngIf="cartItems.length === 0"
      (click)="goToProducts()"
      class="w-full btn-primary justify-center py-3 font-semibold">
      Start Shopping
    </button>
    <button 
      class="w-full btn-outline justify-center py-2"
      (click)="closeCartDrawer()">
      Close Drawer
    </button>
  </div>
</app-ui-drawer>
