<header class="sticky top-0 z-50 bg-card border-b border-border shadow-md">
  <nav class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between px-4 md:px-6 py-3 md:py-4 gap-4">
      
      <!-- Left: Cart Icon -->
      <div class="flex items-center">
        <button 
          (click)="toggleCartDrawer()"
          class="relative p-2 hover:bg-secondary rounded-lg transition-colors duration-200 group">
          <svg class="w-6 h-6 text-foreground group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m10-9l2 9m-9-9h14M9 18h12"></path>
          </svg>
          <span *ngIf="cartItemCount > 0" 
            class="absolute top-0 right-0 inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-accent-foreground bg-accent rounded-full">
            {{ cartItemCount }}
          </span>
        </button>
      </div>

      <!-- Center: Logo & Main Links -->
      <div class="flex-1 flex flex-col items-center gap-2">
        <!-- Logo -->
        <h1 class="text-xl md:text-2xl font-bold gradient-text cursor-pointer flex items-center gap-2"
          (click)="goToHome()">
          <svg class="w-6 md:w-8 h-6 md:h-8" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7 4V3m10 0v1m3.15 2.75h2.08a2 2 0 012 2v12a2 2 0 01-2 2H1.92a2 2 0 01-2-2V8.75a2 2 0 012-2h2.08m0 0A2 2 0 017 5h10a2 2 0 012 2m0 0V7a2 2 0 11-4 0V5m-4 0a2 2 0 11-4 0v2m0-2V5a2 2 0 10-4 0v2"></path>
          </svg>
          <span class="hidden sm:inline">Market</span>
        </h1>

        <!-- Main Navigation -->
        <ul class="flex gap-6 md:gap-12 list-none m-0 p-0">
          <li class="nav-link-hover">
            <a 
              routerLink="/products"
              routerLinkActive="text-accent"
              [routerLinkActiveOptions]="{ exact: true }"
              class="text-foreground font-semibold text-sm md:text-base hover:text-accent transition-colors flex items-center gap-2">
              <svg class="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 13h2v8H3zm4-8h2v16H7zm4-2h2v18h-2zm4 4h2v14h-2zm4-4h2v18h-2z"></path>
              </svg>
              <span class=" xs:inline">Home</span>
            </a>
          </li>
          <li class="nav-link-hover">
            <a 
              href="#featured"
              class="text-foreground font-semibold text-sm md:text-base hover:text-accent transition-colors flex items-center gap-2">
              <svg class="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
              </svg>
              <span class=" xs:inline">Featured</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Right: User Icons -->
      <div class="flex items-center gap-2">
        <button 
          (click)="isLoggedIn ? logout() : goToAuth()"
          class="p-2 hover:bg-secondary rounded-lg transition-colors duration-200 group"
          [title]="isLoggedIn ? 'Logout' : 'Login'">
          <svg *ngIf="!isLoggedIn" class="w-6 h-6 text-foreground group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <svg *ngIf="isLoggedIn" class="w-6 h-6 text-foreground group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
        </button>
      </div>
    </div>
  </nav>
</header>

<!-- Cart Drawer Overlay -->
<div *ngIf="isCartDrawerOpen" 
  class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity duration-300"
  (click)="closeCartDrawer()">
</div>

<!-- Cart Drawer -->
<div [ngClass]="{'translate-x-0': isCartDrawerOpen, 'translate-x-full': !isCartDrawerOpen}"
  class="fixed right-0 top-16 h-[calc(100vh-64px)] w-96 max-w-[calc(100vw-32px)] bg-card border-l border-border shadow-lg transition-transform duration-300 ease-out z-40 flex flex-col">
  
  <!-- Drawer Header -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-border">
    <h2 class="text-lg font-bold flex items-center gap-2">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M7 4V3m10 0v1m3.15 2.75h2.08a2 2 0 012 2v12a2 2 0 01-2 2H1.92a2 2 0 01-2-2V8.75a2 2 0 012-2h2.08m0 0A2 2 0 017 5h10a2 2 0 012 2m0 0V7a2 2 0 11-4 0V5m-4 0a2 2 0 11-4 0v2m0-2V5a2 2 0 10-4 0v2"></path>
      </svg>
      Shopping Cart
    </h2>
    <button 
      (click)="closeCartDrawer()"
      class="p-1 hover:bg-secondary rounded-lg transition-colors">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Drawer Content (scrollable) -->
  <div class="flex-1 overflow-y-auto custom-scrollbar px-6 py-4">
    <!-- Empty State -->
    <div class="flex flex-col items-center justify-center h-full text-center py-12">
      <svg class="w-12 h-12 text-muted-foreground mb-3 opacity-50" fill="currentColor" viewBox="0 0 24 24">
        <path d="M7 4V3m10 0v1m3.15 2.75h2.08a2 2 0 012 2v12a2 2 0 01-2 2H1.92a2 2 0 01-2-2V8.75a2 2 0 012-2h2.08m0 0A2 2 0 017 5h10a2 2 0 012 2m0 0V7a2 2 0 11-4 0V5m-4 0a2 2 0 11-4 0v2m0-2V5a2 2 0 10-4 0v2"></path>
      </svg>
      <p class="text-muted-foreground font-medium mb-2">Your cart is empty</p>
      <p class="text-sm text-muted-foreground mb-4">Add items to get started</p>
      <button 
        (click)="goToHome()"
        class="btn-primary text-xs">
        Continue Shopping
      </button>
    </div>
  </div>

  <!-- Drawer Footer -->
  <div class="border-t border-border px-6 py-4 space-y-3">
    <button 
      class="w-full btn-primary justify-center">
      View Cart
    </button>
    <button 
      class="w-full btn-outline justify-center"
      (click)="closeCartDrawer()">
      Continue Shopping
    </button>
  </div>
</div>
