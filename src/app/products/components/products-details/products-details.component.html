<div class="max-w-6xl mx-auto p-4">
  <!-- Loading State -->
  <div 
    *ngIf="loading"
    class="flex justify-center items-center min-h-screen">
    <app-spinner></app-spinner>
  </div>

  <!-- Product Details -->
  <div 
    *ngIf="!loading"
    class="grid grid-cols-1 md:grid-cols-5 gap-8">
    
    <!-- Product Image -->
    <div class="md:col-span-2">
      <img 
        src="{{ data.image }}" 
        alt="{{ data.title }}"
        class="w-full rounded-lg object-cover aspect-square shadow-lg">
    </div>

    <!-- Product Information -->
    <div class="md:col-span-3">
      <div class="card glass-card-strong p-6">
        <ul class="space-y-4 text-lg">
          <li class="flex flex-col gap-2">
            <strong class="text-accent flex items-center gap-2">
              <lucide-icon name="tag" class="w-5 h-5"></lucide-icon>
              Title:
            </strong>
            <span class="text-foreground">{{ data.title }}</span>
          </li>
          
          <li class="flex flex-col gap-2">
            <strong class="text-accent flex items-center gap-2">
              <lucide-icon name="folder" class="w-5 h-5"></lucide-icon>
              Category:
            </strong>
            <span class="tag-skill inline-w-max">{{ data.category }}</span>
          </li>
          
          <li class="flex flex-col gap-2">
            <strong class="text-accent flex items-center gap-2">
              <lucide-icon name="file-text" class="w-5 h-5"></lucide-icon>
              Description:
            </strong>
            <span class="text-foreground leading-relaxed">{{ data.description }}</span>
          </li>
          
          <li class="flex flex-col gap-2">
            <strong class="text-accent flex items-center gap-2">
              <lucide-icon name="star" class="w-5 h-5"></lucide-icon>
              Rating:
            </strong>
            <div class="flex items-center gap-2">
              <span class="text-2xl font-bold text-accent">{{ data.rating.rate }}</span>
              <span class="text-sm text-muted-foreground">({{ data.rating.count }} reviews)</span>
            </div>
          </li>
          
          <li class="flex flex-col gap-2 pt-4 border-t border-border">
            <strong class="text-accent flex items-center gap-2">
              <lucide-icon name="dollar-sign" class="w-5 h-5"></lucide-icon>
              Price:
            </strong>
            <span class="text-3xl font-bold text-accent gradient-text">{{ data.price }} L.E</span>
          </li>
        </ul>

        <!-- Add to Cart Button -->
        <button class="btn-primary w-full mt-6 py-3 text-lg font-bold flex items-center justify-center gap-2">
          <lucide-icon name="shopping-cart" class="w-6 h-6"></lucide-icon>
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>
