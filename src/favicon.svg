<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#667eea"/>
  
  <!-- Shopping Bag -->
  <g transform="translate(20, 15)">
    <!-- Bag body -->
    <path d="M 10 15 L 5 40 Q 5 45 10 45 L 50 45 Q 55 45 55 40 L 50 15 Z" 
          fill="white" stroke="none"/>
    
    <!-- Bag handles -->
    <path d="M 15 15 Q 15 5 25 5 Q 35 5 35 15" 
          fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Shopping items inside -->
    <circle cx="20" cy="28" r="3" fill="#764ba2"/>
    <circle cx="30" cy="32" r="3" fill="#764ba2"/>
    <circle cx="40" cy="28" r="3" fill="#764ba2"/>
  </g>
  
  <!-- Star accent (premium) -->
  <g transform="translate(65, 15)">
    <path d="M 8 0 L 10 6 L 16 6 L 11 10 L 13 16 L 8 12 L 3 16 L 5 10 L 0 6 L 6 6 Z" 
          fill="#ffd700"/>
  </g>
</svg>
